# GitHub Workflow to run tests automatically
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python pytest and mypy
on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Install Poetry
        run: |
          python -m pip install poetry==2.5.1
          poetry install

      - name: Test with pytest
        run: >
          poetry run pytest
          --cov=jirahours
          --junitxml=junit/test-results.xml
          --md-report --md-report-color=never --md-report-output=pytest-report.md

      - name: Add pytest report to job summary
        if: always()
        run: |
          if [ -f pytest-report.md ]; then
            cat pytest-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test with mypy
        if: always()
        run: poetry run mypy --junit-xml=mypy/test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            junit/test-results.xml
            mypy/test-results.xml
          if-no-files-found: ignore
